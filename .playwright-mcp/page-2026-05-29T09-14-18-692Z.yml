        - heading "Standard Terms" [level=1] [ref=e142]
        - list [ref=e143]:
          - listitem [ref=e144]:
            - paragraph [ref=e145]:
              - strong [ref=e146]: Introduction
              - text: . This Mutual Non-Disclosure Agreement (which incorporates these Standard Terms and the Cover Page) ("
              - strong [ref=e147]: MNDA
              - text: "\") allows each party (\""
              - strong [ref=e148]: Disclosing Party
              - text: "\") to disclose or make available information in connection with the"
              - strong [ref=e149]: Evaluating whether to enter into a business relationship with the other party.
              - text: which (1) the Disclosing Party identifies to the receiving party ("
              - strong [ref=e150]: Receiving Party
              - text: "\") as \"confidential\", \"proprietary\", or the like or (2) should be reasonably understood as confidential or proprietary due to its nature and the circumstances of its disclosure (\""
              - strong [ref=e151]: Confidential Information
              - text: "\"). Each party's Confidential Information also includes the existence and status of the parties' discussions and information on the Cover Page."
          - listitem [ref=e152]:
            - paragraph [ref=e153]:
              - strong [ref=e154]: Use and Protection of Confidential Information
              - text: ". The Receiving Party shall: (a) use Confidential Information solely for the"
              - strong [ref=e155]: Evaluating whether to enter into a business relationship with the other party.
              - text: ; (b) not disclose Confidential Information to third parties without the Disclosing Party's prior written approval, except that the Receiving Party may disclose Confidential Information to its employees, agents, advisors, contractors and other representatives having a reasonable need to know for the
              - strong [ref=e156]: Evaluating whether to enter into a business relationship with the other party.
              - text: ", provided these representatives are bound by confidentiality obligations no less protective of the Disclosing Party than the applicable terms in this MNDA and the Receiving Party remains responsible for their compliance with this MNDA; and (c) protect Confidential Information using at least the same protections the Receiving Party uses for its own similar information but no less than a reasonable standard of care."
          - listitem [ref=e157]:
            - paragraph [ref=e158]:
              - strong [ref=e159]: Exceptions
              - text: ". The Receiving Party's obligations in this MNDA do not apply to information that it can demonstrate: (a) is or becomes publicly available through no fault of the Receiving Party; (b) it rightfully knew or possessed prior to receipt from the Disclosing Party without confidentiality restrictions; (c) it rightfully obtained from a third party without confidentiality restrictions; or (d) it independently developed without using or referencing the Confidential Information."
          - listitem [ref=e160]:
            - paragraph [ref=e161]:
              - strong [ref=e162]: Disclosures Required by Law
              - text: . The Receiving Party may disclose Confidential Information to the extent required by law, regulation or regulatory authority, subpoena or court order, provided (to the extent legally permitted) it provides the Disclosing Party reasonable advance notice of the required disclosure and reasonably cooperates, at the Disclosing Party's expense, with the Disclosing Party's efforts to obtain confidential treatment for the Confidential Information.
          - listitem [ref=e163]:
            - paragraph [ref=e164]:
              - strong [ref=e165]: Term and Termination
              - text: . This MNDA commences on the
              - strong [ref=e166]: May 29, 2026
              - text: and expires at the end of the
              - strong [ref=e167]: 1 year(s) from Effective Date
              - text: . Either party may terminate this MNDA for any or no reason upon written notice to the other party. The Receiving Party's obligations relating to Confidential Information will survive for the
              - strong [ref=e168]: 1 year(s) from Effective Date, but in the case of trade secrets until Confidential Information is no longer considered a trade secret under applicable laws
              - text: ", despite any expiration or termination of this MNDA."
          - listitem [ref=e169]:
            - paragraph [ref=e170]:
              - strong [ref=e171]: Return or Destruction of Confidential Information
              - text: ". Upon expiration or termination of this MNDA or upon the Disclosing Party's earlier request, the Receiving Party will: (a) cease using Confidential Information; (b) promptly after the Disclosing Party's written request, destroy all Confidential Information in the Receiving Party's possession or control or return it to the Disclosing Party; and (c) if requested by the Disclosing Party, confirm its compliance with these obligations in writing."
          - listitem [ref=e172]:
            - paragraph [ref=e173]:
              - strong [ref=e174]: Proprietary Rights
              - text: . The Disclosing Party retains all of its intellectual property and other rights in its Confidential Information and its disclosure to the Receiving Party grants no license under such rights.
          - listitem [ref=e175]:
            - paragraph [ref=e176]:
              - strong [ref=e177]: Disclaimer
              - text: . ALL CONFIDENTIAL INFORMATION IS PROVIDED "AS IS", WITH ALL FAULTS, AND WITHOUT WARRANTIES, INCLUDING THE IMPLIED WARRANTIES OF TITLE, MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE.
          - listitem [ref=e178]:
            - paragraph [ref=e179]:
              - strong [ref=e180]: Governing Law and Jurisdiction
              - text: . This MNDA and all matters relating hereto are governed by, and construed in accordance with, the laws of the State of
              - strong [ref=e181]: "[Governing Law]"
              - text: ", without regard to the conflict of laws provisions of such"
              - strong [ref=e182]: "[Governing Law]"
              - text: . Any legal suit, action, or proceeding relating to this MNDA must be instituted in the federal or state courts located in
              - strong [ref=e183]: "[Jurisdiction]"
              - text: . Each party irrevocably submits to the exclusive jurisdiction of such
              - strong [ref=e184]: "[Jurisdiction]"
              - text: in any such suit, action, or proceeding.
          - listitem [ref=e185]:
            - paragraph [ref=e186]:
              - strong [ref=e187]: Equitable Relief
              - text: . A breach of this MNDA may cause irreparable harm for which monetary damages are an insufficient remedy. Upon a breach of this MNDA, the Disclosing Party is entitled to seek appropriate equitable relief, including an injunction, in addition to its other remedies.
          - listitem [ref=e188]:
            - paragraph [ref=e189]:
              - strong [ref=e190]: General
              - text: . Neither party has an obligation under this MNDA to disclose Confidential Information to the other or proceed with any proposed transaction. Neither party may assign this MNDA without the prior written consent of the other party, except that either party may assign this MNDA in connection with a merger, reorganization, acquisition or other transfer of all or substantially all its assets or voting securities. This MNDA may only be amended, modified, waived, or supplemented by an agreement in writing signed by both parties.
