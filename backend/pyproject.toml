[project]
name = "prelegal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0.0",
    "litellm>=1.87.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
